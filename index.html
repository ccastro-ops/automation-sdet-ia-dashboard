  /* Project status timeline */
  .timeline { display: flex; align-items: flex-start; margin: 4px 0 4px; }
  .timeline-step { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .timeline-step:not(:first-child)::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--baseline); z-index: 0; }

  .mode-row-label { font-size: 12.5px; color: var(--text-primary); }
  .mode-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--gridline); }
  .mode-seg.good { background: #0ca30c; }
  .mode-seg.warning { background: #fab219; }
  .mode-seg.critical { background: #d03b3b; }
  .mode-seg.pending { background: var(--baseline); }
  .mode-row-count { font-size: 11.5px; color: var(--text-primary); }
  .mode-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gridline); }
  .mode-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-primary); }
  .mode-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .mode-legend-dot.good { background: #0ca30c; }
  .mode-legend-dot.warning { background: #fab219; }
  .mode-legend-dot.critical { background: #d03b3b; }

  .progress-note { font-size: 12.5px; color: var(--text-primary); margin: 0 0 12px; }
  .candidate-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .candidate-card + .candidate-card { margin-top: 10px; }
  .candidate-summary { padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; list-style: none; }
  .candidate-summary::-webkit-details-marker { display: none; }
  .candidate-summary .chev { color: var(--text-primary); font-size: 12px; }
  .candidate-name-done { color: #0ca30c; }
  .candidate-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--brand-brown); background: rgba(237,204,77,0.3); border: 1px solid transparent; padding: 2px 8px; border-radius: 999px; margin-left: 10px; }
  .candidate-body { padding: 0 16px 16px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; font-size: 13px; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field-label { color: var(--text-primary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }

  .checklist { margin-top: 16px; border-top: 1px solid var(--gridline); padding-top: 12px; }

  .checklist-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .checklist-dot.good { background: #0ca30c; }
  .checklist-dot.warning { background: #fab219; }
  .checklist-dot.critical { background: #d03b3b; }
  .checklist-dot.pending { background: var(--baseline); }
  .checklist-label { flex: 1; }
  .checklist-status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; flex: none; }
  .checklist-status.good { color: #0ca30c; background: rgba(12,163,12,0.12); }
  .checklist-status.warning { color: #8A6D00; background: rgba(250,178,25,0.18); }
  .checklist-status.critical { color: #d03b3b; background: rgba(208,59,59,0.12); }
  .checklist-status.pending { color: var(--text-primary); background: var(--page-plane); }
  .extra-skills { margin-top: 14px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .extra-skills .field-value { font-size: 13px; }
</style>
</head>

      var dotContent = state === 'done' ? '✓' : String(i + 1);

  function renderModeChart(lang, cfg) {
    var t = translations[lang];
    var total = cfg.candidates.length;
    var order = ['good', 'warning', 'critical', 'pending'];

    var rows = cfg.requirements.map(function(item) {
      var counts = { good: 0, warning: 0, critical: 0, pending: 0 };
      cfg.candidates.forEach(function(c) {
        counts[statusInfo(c.checklist[item.key])]++;
      });
      var segs = order.map(function(k) {
        if (!counts[k]) return '';
        var pct = (counts[k] / total * 100);
        return '<div class="mode-seg ' + k + '" style="width:' + pct + '%" title="' + t.statusLabels[k] + ': ' + counts[k] + '"></div>';
      }).join('');
      return '<div class="mode-row">' +
          '<div class="mode-row-label">' + item[lang] + '</div>' +
          '<div class="mode-bar">' + segs + '</div>' +
        '</div>';
    }).join('');

    var legend = order.map(function(k) {
      return '<span class="mode-legend-item"><span class="mode-legend-dot ' + k + '"></span>' + t.statusLabels[k] + '</span>';
    }).join('');

    return '<div class="mode-chart">' + rows + '</div><div class="mode-legend">' + legend + '</div>';
  }

  function topTools(n, cfg) {
    var freq = {};
    cfg.candidates.forEach(function(c) {
      (c.aiToolTags || []).forEach(function(tag) { freq[tag] = (freq[tag] || 0) + 1; });
    });
    return Object.keys(freq).map(function(k) { return { tag: k, count: freq[k] }; })
      .sort(function(a, b) { return b.count - a.count || a.tag.localeCompare(b.tag); })
      .slice(0, n);
  }

  function chipList(list) {
    if (!list.length) return '';
    return '<div class="chip-list">' + list.map(function(v) { return '<span class="chip">' + v + '</span>'; }).join('') + '</div>';
  }

  // Todas las cifras de salario capturadas se registran en pesos mexicanos (MXN),
  // brutos antes de impuestos, con base en el último salario reportado por el
  // candidato — por eso ya no se exige el texto "MXN" para reconocer el valor.
  function parseSalaryAmount(str) {
    var s = str || '';
    var m = s.replace(/,/g, '').match(/\$?\s*(\d{2,7})/);
    return m ? parseInt(m[1], 10) : null;
  }

  function salaryRangeText(cfg) {
    var values = cfg.candidates.map(function(c) { return parseSalaryAmount(c.salary); }).filter(function(v) { return v !== null; });
    if (!values.length) return null;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var fmt = function(n) { return '$' + n.toLocaleString('es-MX'); };
    return { text: (min === max ? fmt(min) + ' MXN' : fmt(min) + ' – ' + fmt(max) + ' MXN'), n: values.length };
  }

  // Los campos de edad son texto libre ("30 años aproximado", "No proporcionado",
  // etc.) — se toma el primer número que aparezca como la edad aproximada.
  function parseAgeYears(str) {
    var s = str || '';
    var m = s.match(/(\d{1,3})/);
    return m ? parseInt(m[1], 10) : null;
  }

  function ageRangeText(lang, cfg) {
    var values = cfg.candidates.map(function(c) { return parseAgeYears(c.age); }).filter(function(v) { return v !== null; });
    if (!values.length) return null;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var unit = function(n) { return lang === 'es' ? (n === 1 ? ' año' : ' años') : (n === 1 ? ' yr' : ' yrs'); };
    return { text: (min === max ? (min + unit(min)) : (min + ' – ' + max + unit(max))), n: values.length };
  }

  function renderAnalysis(lang) {
    var cfg = JD_CONFIGS[currentJD];
    var t = translations[lang];
    var total = cfg.candidates.length;

    if (!total) {
      document.getElementById('analysisCard').innerHTML = '<div class="empty-state"><strong>' + t.analysisEmptyTitle + '</strong><span>' + t.analysisEmptyBody + '</span></div>';
      return;
    }

    var withDetail = callsCompletedCount(cfg);
    var locations = uniqueNonEmpty(cfg.candidates.map(function(c) { return c.location; }));
    var tools = topTools(6, cfg);
    var salaryRange = salaryRangeText(cfg);

    var withLevel = cfg.candidates.filter(function(c) { return typeof c.yearsExperience === 'number'; });
    var yearsLabelFor = function(c) {
      return (c.yearsApprox ? '~' : '') + c.yearsExperience + (c.yearsPlus ? '+' : '') + (lang === 'es' ? (c.yearsExperience === 1 ? ' año' : ' años') : (c.yearsExperience === 1 ? ' yr' : ' yrs'));
    };
    var seniorityRangeText = '';
    if (withLevel.length) {
      var minC = withLevel.reduce(function(a, b) { return b.yearsExperience < a.yearsExperience ? b : a; });
      var maxC = withLevel.reduce(function(a, b) { return b.yearsExperience > a.yearsExperience ? b : a; });
      if (cfg.hasSeniorityLevels) {
        var minText = seniorityLevel(minC.yearsExperience, cfg) + ' (' + yearsLabelFor(minC) + ')';
        var maxText = seniorityLevel(maxC.yearsExperience, cfg) + ' (' + yearsLabelFor(maxC) + ')';
        seniorityRangeText = minC === maxC ? minText : minText + ' – ' + maxText;
      } else {
        seniorityRangeText = minC === maxC ? yearsLabelFor(minC) : yearsLabelFor(minC) + ' – ' + yearsLabelFor(maxC);
      }
    }

    var toolsValue = tools.length
      ? tools.map(function(x) { return x.tag + ' (' + x.count + ')'; }).join(', ')
      : t.pendingValue;
    var locationsValue = locations.length ? chipList(locations) : ('<span class="field-value pending">' + t.pendingValue + '</span>');
    var seniorityValue = seniorityRangeText ? ('<div class="field-value">' + seniorityRangeText + '</div>') : ('<span class="field-value pending">' + t.pendingValue + '</span>');
    var salaryValue = salaryRange
      ? salaryRange.text + '<div class="mode-row-count" style="margin-top:4px;">' + t.salaryRangeNote.replace('{n}', salaryRange.n) + '</div>'
      : t.salaryRangeEmpty;

    var ageRange = ageRangeText(lang, cfg);
    var ageValue = ageRange
      ? ageRange.text + '<div class="mode-row-count" style="margin-top:4px;">' + t.ageRangeNote.replace('{n}', ageRange.n) + '</div>'
      : t.ageRangeEmpty;

    var html = '<div class="analysis-item"><div class="field-label">' + t.analysisProgress + '</div><div class="field-value">' + withDetail + ' / ' + total + '</div></div>' +
      '<div class="analysis-block" style="margin-top:16px;">' +
        '<div class="field-label" style="margin-bottom:10px;">' + t.analysisModeTitle.replace('{n}', total) + '</div>' +
        renderModeChart(lang, cfg) +
      '</div>' +
      '<div class="analysis-grid" style="margin-top:20px;">' +
        '<div class="analysis-item"><div class="field-label">' + t.analysisTools + '</div><div class="field-value' + (tools.length ? '' : ' pending') + '">' + toolsValue + '</div></div>' +
        '<div class="analysis-item"><div class="field-label">' + t.analysisLocations + '</div>' + locationsValue + '</div>' +
        '<div class="analysis-item"><div class="field-label">' + cfg.seniorityLabel[lang] + '</div>' + seniorityValue + '</div>' +
        '<div class="analysis-item"><div class="field-label">' + t.analysisAge + '</div><div class="field-value' + (ageRange ? '' : ' pending') + '">' + ageValue + '</div></div>' +
        '<div class="analysis-item"><div class="field-label">' + t.analysisSalary + '</div><div class="field-value' + (salaryRange ? '' : ' pending') + '">' + salaryValue + '</div></div>' +
      '</div>';
    document.getElementById('analysisCard').innerHTML = html;
  }

  function applyLang(lang) {
    var cfg = JD_CONFIGS[currentJD];
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];
    });
    document.getElementById('langBtn').textContent = lang === 'es' ? 'English' : 'Español';
    document.documentElement.setAttribute('lang', lang);
    document.getElementById('jdTitleEl').textContent = cfg.title[lang];
    document.getElementById('jdSubtitleEl').textContent = cfg.subtitle[lang];
    renderTabs(lang);
    renderOverview(lang);
    renderTimeline(lang);
    renderAnalysis(lang);
    renderCandidates(lang);
  }

  function toggleLang() { currentLang = currentLang === 'es' ? 'en' : 'es'; applyLang(currentLang); }
  function toggleTheme() { var root = document.documentElement; var current = root.getAttribute('data-theme'); root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark'); }

  applyLang(currentLang);
</script>
