  var currentLang = 'es';

  function fieldOrPending(val, t) {
    var v = (val || "").trim();
    return v ? '<div class="field-value">' + v + '</div>' : '<div class="field-value pending">' + t.pendingValue + '</div>';
  }

  function renderCandidates(lang) {
    var t = translations[lang];
    var html = candidates.map(function(c) {
      var hasDetail = [c.age, c.location, c.seniority, c.tools, c.languages, c.salary].some(function(v) { return (v || "").trim(); });
      var badge = hasDetail ? t.candidateBadgeDone : t.candidateBadgePending;
      var zohoField = c.zoho && c.zoho.trim()
        ? '<div class="field-value"><a href="' + c.zoho + '" target="_blank" rel="noopener">' + t.viewProfile + '</a></div>'
        : '<div class="field-value pending">' + t.pendingValue + '</div>';
      return '<details class="candidate-card">' +
        '<summary class="candidate-summary"><span>' + c.name + ' <span class="candidate-badge">' + badge + '</span></span><span class="chev">▾</span></summary>' +
        '<div class="candidate-body"><div class="field-grid">' +
          '<div><div class="field-label">' + t.fieldName + '</div><div class="field-value">' + c.name + '</div></div>' +
          '<div><div class="field-label">' + t.fieldHeadline + '</div><div class="field-value"><a href="' + c.linkedin + '" target="_blank" rel="noopener">' + t.viewProfile + '</a></div></div>' +
          '<div><div class="field-label">' + t.fieldZoho + '</div>' + zohoField + '</div>' +
          '<div><div class="field-label">' + t.fieldAge + '</div>' + fieldOrPending(c.age, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldLocation + '</div>' + fieldOrPending(c.location, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldSeniority + '</div>' + fieldOrPending(c.seniority, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldAiTools + '</div>' + fieldOrPending(c.tools, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldLanguages + '</div>' + fieldOrPending(c.languages, t) + '</div>' +
          '<div><div class="field-label">' + t.fieldSalary + '</div>' + fieldOrPending(c.salary, t) + '</div>' +
        '</div>' +
        '<div class="checklist">' +
          '<div class="checklist-title">' + t.checklistTitle + '</div>' +
          JD_ITEMS.map(function(item) {
            var status = statusInfo(c.checklist[item.key]);
            return '<div class="checklist-row">' +
              '<span class="checklist-dot ' + status + '"></span>' +
              '<span class="checklist-label">' + item[lang] + '</span>' +
              '<span class="checklist-status ' + status + '">' + t.statusLabels[status] + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="extra-skills">' +
          '<div class="field-label">' + t.extraSkillsLabel + '</div>' +
          '<div class="field-value' + (c.extraSkills && c.extraSkills.trim() ? '' : ' pending') + '">' + (c.extraSkills && c.extraSkills.trim() ? c.extraSkills : t.extraSkillsEmpty) + '</div>' +
        '</div>' +
        '</div>' +
      '</details>';
    }).join('');
    document.getElementById('candidatesList').innerHTML = html;
  }

  function renderAnalysis(lang) {
    var t = translations[lang];
    var total = candidates.length;
    var withDetail = candidates.filter(function(c) {
      return [c.age, c.location, c.seniority, c.tools, c.languages, c.salary].some(function(v) { return (v || "").trim(); });
    }).length;
    var tools = uniqueNonEmpty(candidates.map(function(c) { return c.tools; }));
    var locations = uniqueNonEmpty(candidates.map(function(c) { return c.location; }));
    var seniorities = uniqueNonEmpty(candidates.map(function(c) { return c.seniority; }));
    var salaries = uniqueNonEmpty(candidates.map(function(c) { return c.salary; }));

    function listOrPending(list) {
      return list.length ? list.join(', ') : t.pendingValue;
    }

    var html = '<div class="analysis-grid">' +
      '<div class="analysis-item"><div class="field-label">' + t.analysisProgress + '</div><div class="field-value">' + withDetail + ' / ' + total + '</div></div>' +
      '<div class="analysis-item"><div class="field-label">' + t.analysisTools + '</div><div class="field-value' + (tools.length ? '' : ' pending') + '">' + listOrPending(tools) + '</div></div>' +
      '<div class="analysis-item"><div class="field-label">' + t.analysisLocations + '</div><div class="field-value' + (locations.length ? '' : ' pending') + '">' + listOrPending(locations) + '</div></div>' +
      '<div class="analysis-item"><div class="field-label">' + t.analysisSeniority + '</div><div class="field-value' + (seniorities.length ? '' : ' pending') + '">' + listOrPending(seniorities) + '</div></div>' +
      '<div class="analysis-item" style="grid-column: 1 / -1;"><div class="field-label">' + t.analysisSalary + '</div><div class="field-value' + (salaries.length ? '' : ' pending') + '">' + listOrPending(salaries) + '</div></div>' +
    '</div>';
    document.getElementById('analysisCard').innerHTML = html;
  }

  function applyLang(lang) {
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];
    });
    document.getElementById('langBtn').textContent = lang === 'es' ? 'English' : 'Español';
    document.documentElement.setAttribute('lang', lang);
    renderAnalysis(lang);
    renderCandidates(lang);
  }

  function toggleLang() { currentLang = currentLang === 'es' ? 'en' : 'es'; applyLang(currentLang); }
  function toggleTheme() { var root = document.documentElement; var current = root.getAttribute('data-theme'); root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark'); }

  applyLang(currentLang);
</script>
